# nginx config for the production santa-app image.
# Replaces the default server block (copied to /etc/nginx/conf.d/default.conf).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed files under /assets — safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any unknown path serves index.html so client-side
    # routes (React Router) resolve instead of returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
